<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="診療予習帳">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>診療予習帳</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1c1e21;--sub:#6b7280;--line:#e3e5e9;
  --accent:#2f6fde;--accent-weak:#e6eefc;--ok:#1f9d55;--ok-weak:#e3f5ea;
  --am:#2f6fde;--am-weak:#e6eefc;--pm:#d9731a;--pm-weak:#fcefe2;
  --sun:#d64545;--sat:#2f6fde;--danger:#d64545;--today:#fff6d6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111316;--card:#1b1e23;--text:#e8eaed;--sub:#9aa0a6;--line:#2c3037;
  --accent:#6c9cff;--accent-weak:#1e2a44;--ok:#3ecf7a;--ok-weak:#163423;
  --am:#6c9cff;--am-weak:#1e2a44;--pm:#f0a050;--pm-weak:#3a2a17;
  --sun:#ff7b7b;--sat:#7aa7ff;--danger:#ff7b7b;--today:#3a3416;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:15px}
body{padding:0 env(safe-area-inset-right) calc(24px + env(safe-area-inset-bottom)) env(safe-area-inset-left);overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;margin:0;flex:1;text-align:center;white-space:nowrap}
.ib{background:none;border:none;padding:6px 10px;border-radius:8px;color:var(--accent);font-size:16px;min-height:36px;white-space:nowrap}
.ib:active{background:var(--accent-weak)}
.ib.big{font-size:22px;padding:2px 12px}

/* カレンダー */
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;text-align:center;color:var(--sub);padding:4px 0}
.wk span:first-child{color:var(--sun)} .wk span:last-child{color:var(--sat)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{background:var(--card);min-height:86px;padding:2px;min-width:0}
.day.out{opacity:.4}
.day.today{background:var(--today)}
.dnum{font-size:12px;font-weight:600;padding:1px 3px}
.day.sun .dnum{color:var(--sun)} .day.sat .dnum{color:var(--sat)}
.hrow{display:flex;align-items:center;gap:2px;height:26px;border-radius:5px;margin-top:2px;padding:0 2px;
  font-size:10px;border-left:3px solid transparent;overflow:hidden;cursor:pointer}
.hrow .lbl{color:var(--sub);opacity:.6;padding-left:2px}
.hrow.am.has{border-left-color:var(--am);background:var(--am-weak)}
.hrow.pm.has{border-left-color:var(--pm);background:var(--pm-weak)}
.hname{white-space:nowrap;overflow:hidden;flex:1;min-width:0;font-weight:600}
.chk{flex:none;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--sub);background:var(--card);
  padding:0;font-size:12px;line-height:1;color:#fff;display:grid;place-items:center}
.chk.on{background:var(--ok);border-color:var(--ok)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--sub);padding:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 午前・午後画面 */
.wrap{padding:12px;max-width:640px;margin:0 auto}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.lab{font-size:12px;color:var(--sub);margin:10px 0 4px;display:block}
.lab:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.chip:active{background:var(--accent-weak)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.doc{border-color:var(--accent);color:var(--accent)}
.sentan{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);background:var(--bg);
  border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px;text-align:left}
.sentan .chk{width:24px;height:24px;font-size:15px}
.sentan.on{border-color:var(--ok);background:var(--ok-weak)}
.slot{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.slot.open{border-color:var(--accent)}
.shead{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:12px;text-align:left;min-height:50px}
.stime{font-weight:700;font-variant-numeric:tabular-nums;width:44px;flex:none}
.ssum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssum.empty{color:var(--sub);opacity:.6}
.sunit{flex:none;font-size:12px;background:var(--accent-weak);color:var(--accent);border-radius:6px;padding:2px 6px}
.sbody{padding:0 12px 12px}
.units{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.units button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-size:14px;font-variant-numeric:tabular-nums}
.units button.wide{grid-column:span 2;font-size:13px}
.units button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.danger{color:var(--danger);border:none;background:none;padding:10px 0 0;font-size:14px}
.sep{width:100%;font-size:11px;color:var(--sub);margin-top:4px}

/* 検索・設定 */
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.res .when{font-size:12px;color:var(--sub)}
.res .main{margin-top:2px}
.res .memo{font-size:13px;color:var(--sub);margin-top:2px;white-space:pre-wrap}
mark{background:#ffe066;color:#000;border-radius:2px}
.empty-msg{color:var(--sub);text-align:center;padding:30px 0}
h2{font-size:14px;color:var(--sub);margin:22px 4px 6px;font-weight:600}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}
.row input{flex:1}
.sb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;white-space:nowrap;font-size:14px}
.sb.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sb.del{color:var(--danger)}
.doc-block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.doc-block:first-child{border-top:none;padding-top:0;margin-top:0}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
.wgrid{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center}
.wgrid .wh{font-size:12px;color:var(--sub);text-align:center}
.wgrid .wd{text-align:center;font-weight:600}
.wgrid .wd.sun{color:var(--sun)} .wgrid .wd.sat{color:var(--sat)}
.wgrid input{padding:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY = 'shinryoYoshucho.v1';
const UNITS = [...Array.from({length:22}, (_, i) => String(i + 1)), 'オペ室', '検査室'];
const HALF = {
  am: {label:'午前', start:'09:00', end:'12:00'},
  pm: {label:'午後', start:'13:00', end:'16:00'},
};
const WD = '日月火水木金土';

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toTime = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const showTime = t => t.slice(0, 5).replace(/^0/, '');   // 枠キーは "09:00" または同時刻2人目以降 "09:00~2"
const dayLabel = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };

// ---------- データ ----------
function migrate(d) {
  d = d && typeof d === 'object' ? d : {};
  d.version = 1;
  if (!d.days || typeof d.days !== 'object') d.days = {};
  if (!Array.isArray(d.doctors)) d.doctors = [];
  if (!Array.isArray(d.presets)) d.presets = [{id:uid(), label:'先端'}, {id:uid(), label:'メンテ'}];
  if (!d.weekly || typeof d.weekly !== 'object') d.weekly = {};
  if (!d.settings) d.settings = {};
  if (![15, 30, 60].includes(d.settings.step)) d.settings.step = 30;
  return d;
}
function load() {
  try { return migrate(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return migrate(null); }
}
let db = load();

const slotEmpty = s => !s || !(s.patient || s.treatment || s.unit || s.memo);
const keepSlot = s => s && (s.extra || !slotEmpty(s));   // ＋で追加した枠は空でも残す
const halfEmpty = h => !h || !(h.doctor || h.sentan || h.memo || Object.values(h.slots || {}).some(keepSlot));
function prune() {
  for (const [date, day] of Object.entries(db.days)) {
    for (const k of ['am', 'pm']) {
      const h = day[k];
      if (!h) continue;
      for (const [t, s] of Object.entries(h.slots || {})) if (!keepSlot(s)) delete h.slots[t];
      if (halfEmpty(h)) delete day[k];
    }
    if (!day.am && !day.pm) delete db.days[date];
  }
}
let saveTimer;
function saveNow() {
  clearTimeout(saveTimer);
  prune();
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('保存に失敗しました（容量不足の可能性）'); }
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

// 毎回 db から辿る（prune で参照が切れても書き込みが消えないように）
function getHalf(date, h, create) {
  let day = db.days[date];
  if (!day) { if (!create) return null; day = db.days[date] = {}; }
  if (!day[h]) { if (!create) return null; day[h] = {doctor:'', sentan:false, memo:'', slots:{}}; }
  if (!day[h].slots) day[h].slots = {};
  return day[h];
}
function getSlot(date, h, time, create) {
  const half = getHalf(date, h, create);
  if (!half) return null;
  if (!half.slots[time]) { if (!create) return null; half.slots[time] = {patient:'', treatment:'', unit:'', memo:''}; }
  return half.slots[time];
}
function times(date, h) {
  const {start, end} = HALF[h], step = db.settings.step, set = new Set();
  for (let m = toMin(start); m < toMin(end); m += step) set.add(toTime(m));
  const half = getHalf(date, h);
  if (half) for (const [t, s] of Object.entries(half.slots)) if (keepSlot(s)) set.add(t);
  return [...set].sort();
}
const patientCount = half => half ? Object.values(half.slots).filter(s => s.patient || s.treatment).length : 0;
const findDoctor = name => db.doctors.find(d => d.name && d.name === (name || '').trim());

// ---------- 状態・描画 ----------
const now = new Date();
const state = {view:'cal', y:now.getFullYear(), m:now.getMonth(), date:ymd(now), half:'am', open:null, q:'', openDoc:null};
const app = document.getElementById('app');

function go(view, patch = {}) {
  saveNow();
  Object.assign(state, patch, {view});
  render();
  scrollTo(0, 0);
}
function render() {
  app.innerHTML = ({cal:viewCal, half:viewHalf, search:viewSearch, settings:viewSettings})[state.view]();
  if (state.view === 'search') {
    const q = document.getElementById('q');
    q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  }
}

function viewCal() {
  const {y, m} = state, today = ymd(new Date());
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - first.getDay());
  const lastDay = new Date(y, m + 1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + lastDay) / 7);
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = ymd(d), w = d.getDay();
    const cls = ['day', d.getMonth() !== m && 'out', ds === today && 'today', w === 0 && 'sun', w === 6 && 'sat'].filter(Boolean).join(' ');
    let rows = '';
    for (const h of ['am', 'pm']) {
      const half = getHalf(ds, h), has = !halfEmpty(half);
      const n = patientCount(half);
      const name = has ? (half.doctor || (n ? `${n}名` : '・')) : '';
      rows += `<div class="hrow ${h} ${has ? 'has' : ''}" data-open="${ds}|${h}">` +
        (has
          ? `<button class="chk ${half.sentan ? 'on' : ''}" data-chk="${ds}|${h}" aria-label="先端オーダー">${half.sentan ? '✓' : ''}</button><span class="hname">${esc(name)}</span>`
          : `<span class="lbl">${h === 'am' ? '前' : '後'}</span>`) +
        `</div>`;
    }
    cells += `<div class="${cls}"><div class="dnum">${d.getDate()}</div>${rows}</div>`;
  }
  return `
  <header class="bar">
    <button class="ib" data-act="search">検索</button>
    <button class="ib big" data-act="prev" aria-label="前の月">‹</button>
    <h1>${y}年${m + 1}月</h1>
    <button class="ib big" data-act="next" aria-label="次の月">›</button>
    <button class="ib" data-act="settings">設定</button>
  </header>
  <div class="wk">${[...WD].map(c => `<span>${c}</span>`).join('')}</div>
  <div class="cal" id="cal">${cells}</div>
  <div class="legend">
    <span><i style="background:var(--am)"></i>午前</span>
    <span><i style="background:var(--pm)"></i>午後</span>
    <span><i style="background:var(--ok);border-radius:50%"></i>先端オーダー済</span>
  </div>
  <div style="text-align:center">
    <button class="ib" data-act="today">今日へ</button>
    <button class="ib" data-act="weekly">週プリセットを${m + 1}月に反映</button>
  </div>`;
}

function presetChips(doctorName) {
  let html = db.presets.map(p => `<button class="chip" data-preset="${esc(p.label)}">${esc(p.label)}</button>`).join('');
  const doc = findDoctor(doctorName);
  if (doc && doc.presets.length) {
    html += `<div class="sep">${esc(doc.name)} 先生用</div>` +
      doc.presets.map(p => `<button class="chip doc" data-preset="${esc(p.label)}">${esc(p.label)}</button>`).join('');
  }
  return html;
}
function slotSummary(s) {
  if (slotEmpty(s)) return {text:'未入力', empty:true};
  const parts = [s.patient && `${s.patient}`, s.treatment].filter(Boolean);
  return {text: parts.join(' ・ ') || (s.memo ? 'メモあり' : ''), empty:false};
}
const unitLabel = u => u ? (/^\d+$/.test(u) ? `U${u}` : u) : '';

function viewSlot(time) {
  const {date, half: h} = state;
  const s = getSlot(date, h, time) || {patient:'', treatment:'', unit:'', memo:''};
  const open = state.open === time, sum = slotSummary(s);
  const head = `<button class="shead" data-toggle="${time}">
      <span class="stime">${showTime(time)}</span>
      <span class="ssum ${sum.empty ? 'empty' : ''}">${esc(sum.text)}</span>
      <span class="sunit" ${s.unit ? '' : 'hidden'}>${esc(unitLabel(s.unit))}</span>
      <span style="color:var(--sub)">${open ? '▴' : '▾'}</span>
    </button>`;
  if (!open) return `<div class="slot" data-time="${time}">${head}</div>`;
  const half = getHalf(date, h);
  const units = UNITS.map(u => `<button class="${/^\d+$/.test(u) ? '' : 'wide'} ${s.unit === u ? 'on' : ''}" data-unit="${esc(u)}">${esc(u)}</button>`).join('');
  return `<div class="slot open" data-time="${time}">${head}
    <div class="sbody">
      <label class="lab">患者名</label>
      <input data-sf="patient" value="${esc(s.patient)}" placeholder="患者名" autocomplete="off">
      <label class="lab">治療内容</label>
      <input data-sf="treatment" value="${esc(s.treatment)}" placeholder="治療内容（下のボタンで1タップ入力）" autocomplete="off">
      <div class="chips">${presetChips(half && half.doctor)}</div>
      <label class="lab">ユニット</label>
      <div class="units">${units}</div>
      <label class="lab">メモ</label>
      <textarea data-sf="memo" placeholder="予習メモ・注意点など">${esc(s.memo)}</textarea>
      <button class="danger" data-clear="${time}">${s.extra ? 'この枠を削除' : 'この枠をクリア'}</button>
    </div></div>`;
}

function viewHalf() {
  const {date, half: h} = state;
  const half = getHalf(date, h) || {doctor:'', sentan:false, memo:''};
  const docChips = db.doctors.filter(d => d.name).map(d =>
    `<button class="chip ${half.doctor === d.name ? 'on' : ''}" data-doc="${esc(d.name)}">${esc(d.name)}</button>`).join('');
  return `
  <header class="bar">
    <button class="ib" data-act="back">‹ 月表示</button>
    <button class="ib big" data-act="prevday" aria-label="前の日">‹</button>
    <h1>${dayLabel(date)}</h1>
    <button class="ib big" data-act="nextday" aria-label="次の日">›</button>
    <span style="width:62px"></span>
  </header>
  <div class="wrap">
    <div class="seg">
      ${['am', 'pm'].map(k => `<button class="${k === h ? 'on' : ''}" data-half="${k}">${HALF[k].label}<small>${showTime(HALF[k].start)}–${showTime(HALF[k].end)}</small></button>`).join('')}
    </div>
    <div class="card">
      <label class="lab">アシスト先</label>
      <input data-hf="doctor" value="${esc(half.doctor)}" placeholder="先生の名前" autocomplete="off">
      ${docChips ? `<div class="chips">${docChips}</div>` : `<div class="note">「設定」で先生を登録すると、ここでワンタップ選択できます。</div>`}
      <button class="sentan ${half.sentan ? 'on' : ''}" data-act="sentan">
        <span class="chk ${half.sentan ? 'on' : ''}">${half.sentan ? '✓' : ''}</span>
        先端オーダー ${half.sentan ? '済' : '未'}
      </button>
    </div>
    <div id="slots">${times(date, h).map(viewSlot).join('')}</div>
    <div class="card addslot">
      <label class="lab">＋ 枠を追加（時刻を選んで追加。同じ時刻の2人目もOK）</label>
      <div class="row" style="margin-top:0">
        <input type="time" id="addTime" value="${HALF[h].start}" step="300">
        <button class="sb pri" data-act="addslot">＋ 追加</button>
      </div>
    </div>
    <div class="card">
      <label class="lab">${HALF[h].label}のメモ</label>
      <textarea data-hf="memo" placeholder="この枠全体のメモ">${esc(half.memo)}</textarea>
    </div>
  </div>`;
}

function hl(text, q) {
  text = String(text || '');
  if (!q) return esc(text);
  const lower = text.toLowerCase(), ql = q.toLowerCase();
  let out = '', i = 0, j;
  while ((j = lower.indexOf(ql, i)) !== -1) {
    out += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + q.length)) + '</mark>';
    i = j + q.length;
  }
  return out + esc(text.slice(i));
}
function searchResults(q) {
  const ql = q.trim().toLowerCase();
  if (!ql) return '<div class="empty-msg">患者名・治療内容・先生・メモなどを検索できます</div>';
  const hit = (...xs) => xs.some(x => String(x || '').toLowerCase().includes(ql));
  const items = [];
  for (const date of Object.keys(db.days).sort().reverse()) {
    for (const h of ['am', 'pm']) {
      const half = db.days[date][h];
      if (!half) continue;
      if (hit(half.doctor, half.memo)) {
        items.push(`<button class="res" data-go="${date}|${h}|">
          <div class="when">${dayLabel(date)} ${HALF[h].label}</div>
          <div class="main">アシスト先：${hl(half.doctor || '—', q.trim())}</div>
          ${half.memo ? `<div class="memo">${hl(half.memo, q.trim())}</div>` : ''}</button>`);
      }
      for (const t of Object.keys(half.slots).sort()) {
        const s = half.slots[t];
        if (!hit(s.patient, s.treatment, s.memo, s.unit, unitLabel(s.unit))) continue;
        items.push(`<button class="res" data-go="${date}|${h}|${t}">
          <div class="when">${dayLabel(date)} ${HALF[h].label} ${showTime(t)}${s.unit ? ' ・ ' + hl(unitLabel(s.unit), q.trim()) : ''}${half.doctor ? ' ・ ' + esc(half.doctor) : ''}</div>
          <div class="main">${hl(s.patient || '（患者名なし）', q.trim())}${s.treatment ? ' ・ ' + hl(s.treatment, q.trim()) : ''}</div>
          ${s.memo ? `<div class="memo">${hl(s.memo, q.trim())}</div>` : ''}</button>`);
      }
    }
  }
  return items.length ? `<div class="note">${items.length}件</div>` + items.join('') : '<div class="empty-msg">見つかりませんでした</div>';
}
function viewSearch() {
  return `
  <header class="bar">
    <button class="ib" data-act="back">‹ 月表示</button>
    <h1>検索</h1><span style="width:80px"></span>
  </header>
  <div class="wrap">
    <input id="q" type="search" value="${esc(state.q)}" placeholder="キーワードを入力" autocomplete="off">
    <div id="results">${searchResults(state.q)}</div>
  </div>`;
}

function presetEditor(listId, list) {
  return list.map((p, i) => `<div class="row">
      <input data-pl="${listId}|${p.id}" value="${esc(p.label)}">
      <button class="sb" data-pup="${listId}|${p.id}" ${i === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="上へ">↑</button>
      <button class="sb del" data-pdel="${listId}|${p.id}">削除</button>
    </div>`).join('') +
    `<div class="row"><input id="padd-${listId}" placeholder="新しいボタン名"><button class="sb pri" data-padd="${listId}">追加</button></div>`;
}
function viewSettings() {
  const step = db.settings.step;
  const docs = db.doctors.map(d => `<div class="doc-block">
      <div class="row">
        <input data-dn="${d.id}" value="${esc(d.name)}" placeholder="先生の名前">
        <button class="sb" data-dopen="${d.id}">${state.openDoc === d.id ? '閉じる' : `ボタン(${d.presets.length})`}</button>
        <button class="sb del" data-ddel="${d.id}">削除</button>
      </div>
      ${state.openDoc === d.id ? `<div class="note">${esc(d.name)} 先生のときだけ表示されるボタン</div>${presetEditor(d.id, d.presets)}` : ''}
    </div>`).join('');
  const last = db.settings.lastBackup;
  return `
  <header class="bar">
    <button class="ib" data-act="back">‹ 月表示</button>
    <h1>設定</h1><span style="width:80px"></span>
  </header>
  <div class="wrap">
    <h2>治療内容ボタン（全員共通）</h2>
    <div class="card" style="margin-top:0">${presetEditor('global', db.presets)}</div>

    <h2>アシスト先の先生 と 先生ごとのボタン</h2>
    <div class="card" style="margin-top:0">
      ${docs || '<div class="note" style="margin-top:0">まだ登録がありません</div>'}
      <div class="row" style="margin-top:12px"><input id="dadd" placeholder="先生の名前を追加"><button class="sb pri" data-act="dadd">追加</button></div>
    </div>

    <h2>週の診療プリセット（曜日ごとのアシスト先）</h2>
    <div class="card" style="margin-top:0">
      <datalist id="doclist">${db.doctors.filter(d => d.name).map(d => `<option value="${esc(d.name)}">`).join('')}</datalist>
      <div class="wgrid"><span></span><span class="wh">午前</span><span class="wh">午後</span>
      ${[1, 2, 3, 4, 5, 6, 0].map(w => `<span class="wd ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${WD[w]}</span>` +
        ['am', 'pm'].map(h => `<input data-wk="${w}${h}" list="doclist" value="${esc(db.weekly[w + h] || '')}" placeholder="—" autocomplete="off">`).join('')).join('')}
      </div>
      <div class="note">月表示の下の「週プリセットを○月に反映」で、アシスト先が空欄の枠にまとめて入ります。休診日などは各日の画面で消してください。</div>
    </div>

    <h2>時間枠の刻み</h2>
    <div class="seg">${[15, 30, 60].map(n => `<button class="${n === step ? 'on' : ''}" data-step="${n}">${n}分</button>`).join('')}</div>
    <div class="note">午前 9:00–12:00 / 午後 13:00–16:00。変更しても入力済みの枠は残ります。</div>

    <h2>バックアップ</h2>
    <div class="card" style="margin-top:0">
      <div class="row" style="margin-top:0">
        <button class="sb pri" data-act="export" style="flex:1">書き出す</button>
        <button class="sb" data-act="import" style="flex:1">読み込む</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <div class="note">データはこのiPhoneの中だけに保存されています。機種変更やアプリ削除に備えて、ときどき「書き出す」でファイルアプリ等に保存してください。患者名を含むので取り扱いに注意してください。<br>最終書き出し：${last ? esc(last) : 'なし'}</div>
    </div>

    <h2>データ消去</h2>
    <div class="card" style="margin-top:0">
      <button class="sb del" data-act="wipe">すべてのデータを削除</button>
    </div>
  </div>`;
}

// ---------- 部分更新 ----------
function refreshSlotHead(time) {
  const el = app.querySelector(`.slot[data-time="${time}"]`);
  if (!el) return;
  const s = getSlot(state.date, state.half, time) || {};
  const sum = slotSummary(s);
  const ss = el.querySelector('.ssum');
  ss.textContent = sum.text; ss.classList.toggle('empty', sum.empty);
  const su = el.querySelector('.sunit');
  su.textContent = unitLabel(s.unit); su.hidden = !s.unit;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
const presetList = id => id === 'global' ? db.presets : (db.doctors.find(d => d.id === id) || {presets:[]}).presets;

// ---------- イベント ----------
app.addEventListener('click', e => {
  const t = e.target.closest('button,[data-open]');
  if (!t) return;
  const d = t.dataset;

  if (d.chk) {
    const [date, h] = d.chk.split('|');
    const half = getHalf(date, h, true);
    half.sentan = !half.sentan; saveNow(); render();
    toast(half.sentan ? '先端オーダー済にしました' : '先端オーダーを未にしました');
    return;
  }
  if (d.open) { const [date, half] = d.open.split('|'); return go('half', {date, half, open:null}); }
  if (d.half) { saveNow(); state.half = d.half; state.open = null; return render(); }
  if (d.toggle) {
    saveNow();
    state.open = state.open === d.toggle ? null : d.toggle;
    render();
    const el = app.querySelector(`.slot[data-time="${d.toggle}"]`);
    if (el && state.open) el.scrollIntoView({block:'start', behavior:'smooth'});
    return;
  }
  if (d.doc !== undefined) {
    const half = getHalf(state.date, state.half, true);
    half.doctor = half.doctor === d.doc ? '' : d.doc; saveNow(); return render();
  }
  if (d.preset !== undefined) {
    const time = t.closest('.slot').dataset.time;
    const s = getSlot(state.date, state.half, time, true);
    const cur = (s.treatment || '').trim();
    if (!cur) s.treatment = d.preset;
    else if (!cur.split(/[・、,\s]+/).includes(d.preset)) s.treatment = cur + '・' + d.preset;
    t.closest('.slot').querySelector('[data-sf="treatment"]').value = s.treatment;
    save(); refreshSlotHead(time); return;
  }
  if (d.unit !== undefined) {
    const slot = t.closest('.slot'), time = slot.dataset.time;
    const s = getSlot(state.date, state.half, time, true);
    s.unit = s.unit === d.unit ? '' : d.unit;
    slot.querySelectorAll('[data-unit]').forEach(b => b.classList.toggle('on', b.dataset.unit === s.unit));
    save(); refreshSlotHead(time); return;
  }
  if (d.clear) {
    const cs = getSlot(state.date, state.half, d.clear);
    if (!confirm(`${showTime(d.clear)} の枠を${cs && cs.extra ? '削除' : '空に'}しますか？`)) return;
    const half = getHalf(state.date, state.half);
    if (half) delete half.slots[d.clear];
    saveNow(); return render();
  }
  if (d.go) {
    const [date, half, time] = d.go.split('|'), dt = parseYmd(date);
    return go('half', {date, half, open:time || null, y:dt.getFullYear(), m:dt.getMonth()});
  }
  if (d.step) { db.settings.step = Number(d.step); saveNow(); return render(); }
  if (d.padd) {
    const inp = document.getElementById('padd-' + d.padd), label = inp.value.trim();
    if (!label) return inp.focus();
    presetList(d.padd).push({id:uid(), label}); saveNow(); render();
    document.getElementById('padd-' + d.padd).focus(); return;
  }
  if (d.pdel) {
    const [lid, pid] = d.pdel.split('|'), list = presetList(lid);
    const i = list.findIndex(p => p.id === pid);
    if (i >= 0 && confirm(`「${list[i].label}」ボタンを削除しますか？`)) { list.splice(i, 1); saveNow(); render(); }
    return;
  }
  if (d.pup) {
    const [lid, pid] = d.pup.split('|'), list = presetList(lid);
    const i = list.findIndex(p => p.id === pid);
    if (i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; saveNow(); render(); }
    return;
  }
  if (d.dopen) { state.openDoc = state.openDoc === d.dopen ? null : d.dopen; return render(); }
  if (d.ddel) {
    const doc = db.doctors.find(x => x.id === d.ddel);
    if (doc && confirm(`${doc.name || '（無名）'} 先生を削除しますか？\n（入力済みのアシスト先名は残ります）`)) {
      db.doctors = db.doctors.filter(x => x !== doc); saveNow(); render();
    }
    return;
  }

  switch (d.act) {
    case 'prev': state.m--; if (state.m < 0) { state.m = 11; state.y--; } return render();
    case 'next': state.m++; if (state.m > 11) { state.m = 0; state.y++; } return render();
    case 'today': { const n = new Date(); state.y = n.getFullYear(); state.m = n.getMonth(); return render(); }
    case 'search': return go('search');
    case 'settings': return go('settings');
    case 'back': return go('cal');
    case 'prevday': case 'nextday': {
      const dt = parseYmd(state.date);
      dt.setDate(dt.getDate() + (d.act === 'nextday' ? 1 : -1));
      return go('half', {date:ymd(dt), open:null, y:dt.getFullYear(), m:dt.getMonth()});
    }
    case 'sentan': {
      const half = getHalf(state.date, state.half, true);
      half.sentan = !half.sentan; saveNow(); return render();
    }
    case 'addslot': {
      const v = document.getElementById('addTime').value;
      if (!/^\d{2}:\d{2}$/.test(v)) return toast('時刻を選んでください');
      const half = getHalf(state.date, state.half, true);
      // 30分枠や既存の枠と重なる時刻なら "09:00~2" のように2人目として追加
      const taken = new Set([...times(state.date, state.half), ...Object.keys(half.slots)]);
      let key = v, n = 2;
      while (taken.has(key)) key = `${v}~${n++}`;
      getSlot(state.date, state.half, key, true).extra = true;
      state.open = key; saveNow(); render();
      const el = app.querySelector(`.slot[data-time="${key}"]`);
      if (el) el.scrollIntoView({block:'start', behavior:'smooth'});
      return;
    }
    case 'weekly': {
      const {y, m} = state, last = new Date(y, m + 1, 0).getDate();
      if (!Object.values(db.weekly).some(v => v && v.trim())) { toast('設定で「週の診療プリセット」を登録してください'); return; }
      if (!confirm(`${m + 1}月に週の診療プリセットを反映します。\n（アシスト先が空欄の枠だけに入ります）`)) return;
      let n = 0;
      for (let dd = 1; dd <= last; dd++) {
        const dt = new Date(y, m, dd), ds = ymd(dt);
        for (const h of ['am', 'pm']) {
          const name = (db.weekly[dt.getDay() + h] || '').trim();
          if (!name) continue;
          const cur = getHalf(ds, h);
          if (cur && cur.doctor) continue;
          getHalf(ds, h, true).doctor = name; n++;
        }
      }
      saveNow(); render(); toast(`${n}枠に反映しました`);
      return;
    }
    case 'dadd': {
      const inp = document.getElementById('dadd'), name = inp.value.trim();
      if (!name) return inp.focus();
      if (findDoctor(name)) { toast('同じ名前の先生がいます'); return; }
      const doc = {id:uid(), name, presets:[]};
      db.doctors.push(doc); state.openDoc = doc.id; saveNow(); return render();
    }
    case 'export': return exportData();
    case 'import': return document.getElementById('importFile').click();
    case 'wipe':
      if (confirm('すべてのデータ（予定・先生・ボタン）を削除します。元に戻せません。よろしいですか？') &&
          confirm('本当に削除しますか？')) {
        db = migrate(null); saveNow(); render(); toast('削除しました');
      }
      return;
  }
});

app.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.sf) {
    const time = t.closest('.slot').dataset.time;
    getSlot(state.date, state.half, time, true)[d.sf] = t.value;
    save(); refreshSlotHead(time);
  } else if (d.hf) {
    getHalf(state.date, state.half, true)[d.hf] = t.value; save();
  } else if (d.pl) {
    const [lid, pid] = d.pl.split('|'), p = presetList(lid).find(x => x.id === pid);
    if (p) { p.label = t.value; save(); }
  } else if (d.wk) {
    db.weekly[d.wk] = t.value; save();
  } else if (t.id === 'q') {
    state.q = t.value;
    document.getElementById('results').innerHTML = searchResults(state.q);
  }
});

app.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.hf === 'doctor') { saveNow(); render(); }           // 先生ごとのボタンを反映
  else if (d.pl) {
    const [lid, pid] = d.pl.split('|'), list = presetList(lid), p = list.find(x => x.id === pid);
    if (p && !p.label.trim()) list.splice(list.indexOf(p), 1);
    else if (p) p.label = p.label.trim();
    saveNow(); render();
  } else if (d.dn) {
    const doc = db.doctors.find(x => x.id === d.dn), name = t.value.trim();
    if (!doc || name === doc.name) return;
    if (name && findDoctor(name)) { toast('同じ名前の先生がいます'); t.value = doc.name; return; }
    // 入力済みのアシスト先名も合わせて変更
    for (const day of Object.values(db.days)) for (const h of ['am', 'pm']) if (day[h] && day[h].doctor === doc.name) day[h].doctor = name;
    doc.name = name; saveNow(); render();
  } else if (t.id === 'importFile' && t.files[0]) {
    importData(t.files[0]);
  }
});

app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'dadd') app.querySelector('[data-act="dadd"]').click();
  else if (e.target.id && e.target.id.startsWith('padd-')) app.querySelector(`[data-padd="${e.target.id.slice(5)}"]`).click();
  else if (e.target.tagName === 'INPUT') e.target.blur();
});

// 月表示は左右スワイプでも切替
let sx = null, sy = 0;
app.addEventListener('touchstart', e => {
  if (state.view !== 'cal') return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
app.addEventListener('touchend', e => {
  if (state.view !== 'cal' || sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) app.querySelector(`[data-act="${dx < 0 ? 'next' : 'prev'}"]`).click();
}, {passive:true});

// ---------- バックアップ ----------
async function exportData() {
  saveNow();
  const name = `診療予習帳_${ymd(new Date())}.json`;
  const file = new File([JSON.stringify(db, null, 1)], name, {type:'application/json'});
  const done = () => { db.settings.lastBackup = new Date().toLocaleString('ja-JP'); saveNow(); render(); };
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:name}); return done(); }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  done();
}
async function importData(file) {
  try {
    const obj = JSON.parse(await file.text());
    if (!obj || typeof obj.days !== 'object') throw new Error('format');
    if (!confirm('今のデータを、このファイルの内容で置き換えます。よろしいですか？')) return;
    db = migrate(obj); saveNow(); render(); toast('読み込みました');
  } catch (e) {
    toast('読み込めませんでした（形式が違います）');
  }
}

render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
